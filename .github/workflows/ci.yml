name: AegisSea Geospatial Lakehouse CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Live Telemetry Ingestion
      run: |
        python ingest_engine/ingest.py

    - name: Run Geospatial SQL Transformations & Congestion Modeling
      run: |
        python models/spatial_analysis.py

    - name: Run Data Quality & Spatial Contract Tests
      run: |
        pytest tests/ -v
